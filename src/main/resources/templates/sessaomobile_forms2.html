<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo CEP</title>

    <!-- Bootstrap CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h1 class="text-center mb-4">Cadastrar Sessaomobile</h1>

        <form action="/sessaomobile/salvar" method="post">

            <div class="mb-3">
                <label class="form-label">Id</label>
                <input type="text" name="id" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Dispositivo_ID</label>
                <input type="text" name="dispositivo_id" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Token_Sessao</label>
                <input type="text" name="token_sessao" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Data_Inicio</label>
                <input type="text" name="data_inicio" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Ativo</label>
                <input type="text" name="ativo" class="form-control">
            </div>


            <div class="text-center">
                <button type="submit" class="btn btn-primary w-100">
                    Salvar
                </button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
